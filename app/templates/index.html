<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pavillion Ollama</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2e3140;
      --accent: #7c6af7;
      --accent-hover: #6b58e8;
      --text: #e2e4ef;
      --muted: #6b7280;
      --user-bubble: #2a2d3e;
      --bot-bubble: #1e2132;
      --code-bg: #12141e;
      --radius: 12px;
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.25rem;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    header h1 span { color: var(--accent); }

    .model-select-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .model-select-wrap label {
      font-size: 0.8rem;
      color: var(--muted);
    }

    select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.35rem 0.6rem;
      font-size: 0.85rem;
      cursor: pointer;
      outline: none;
    }

    select:focus { border-color: var(--accent); }

    /* ── Chat area ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 5px; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .bubble-row {
      display: flex;
      gap: 0.65rem;
      max-width: 820px;
      width: 100%;
    }

    .bubble-row.user { align-self: flex-end; flex-direction: row-reverse; }
    .bubble-row.assistant { align-self: flex-start; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .bubble-row.user .avatar { background: var(--accent); }
    .bubble-row.assistant .avatar { background: var(--border); }

    .bubble {
      padding: 0.7rem 1rem;
      border-radius: var(--radius);
      font-size: 0.92rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      max-width: calc(100% - 48px);
    }

    .bubble-row.user .bubble {
      background: var(--user-bubble);
      border-bottom-right-radius: 4px;
    }

    .bubble-row.assistant .bubble {
      background: var(--bot-bubble);
      border-bottom-left-radius: 4px;
    }

    .bubble code {
      background: var(--code-bg);
      padding: 0.15em 0.4em;
      border-radius: 4px;
      font-size: 0.88em;
      font-family: 'Cascadia Code', 'Fira Code', monospace;
    }

    .bubble pre {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.85rem 1rem;
      overflow-x: auto;
      margin: 0.5em 0;
    }

    .bubble pre code {
      background: none;
      padding: 0;
      font-size: 0.85em;
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 1em;
      background: var(--accent);
      border-radius: 2px;
      vertical-align: text-bottom;
      animation: blink 0.8s step-end infinite;
    }

    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      color: var(--muted);
      pointer-events: none;
      user-select: none;
    }

    .empty-state .icon { font-size: 2.5rem; }
    .empty-state p { font-size: 0.9rem; }

    /* ── Input bar ── */
    .input-bar {
      padding: 0.85rem 1rem;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.6rem;
      align-items: flex-end;
      flex-shrink: 0;
    }

    textarea {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.65rem 0.9rem;
      font-family: var(--font);
      font-size: 0.92rem;
      line-height: 1.5;
      resize: none;
      outline: none;
      min-height: 44px;
      max-height: 160px;
      overflow-y: auto;
      transition: border-color 0.15s;
    }

    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--muted); }

    button#send-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      padding: 0.65rem 1.1rem;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      flex-shrink: 0;
      height: 44px;
    }

    button#send-btn:hover:not(:disabled) { background: var(--accent-hover); }
    button#send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    button#clear-btn {
      background: none;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.65rem 0.75rem;
      font-size: 0.85rem;
      cursor: pointer;
      height: 44px;
      transition: color 0.15s, border-color 0.15s;
    }

    button#clear-btn:hover { color: var(--text); border-color: var(--text); }

    .error-msg {
      color: #f87171;
      font-size: 0.82rem;
      padding: 0 1rem 0.4rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Pavillion <span>Ollama</span></h1>
    <div class="model-select-wrap">
      <label for="model-select">Model:</label>
      <select id="model-select">
        {% if models %}
          {% for m in models %}
            <option value="{{ m }}" {% if m == default_model %}selected{% endif %}>{{ m }}</option>
          {% endfor %}
        {% else %}
          <option value="{{ default_model }}">{{ default_model }}</option>
        {% endif %}
      </select>
    </div>
  </header>

  <div id="messages">
    <div class="empty-state" id="empty-state">
      <div class="icon">🦙</div>
      <p>Start a conversation with your local LLM</p>
    </div>
  </div>

  <div class="error-msg" id="error-msg" style="display:none;"></div>

  <div class="input-bar">
    <textarea
      id="user-input"
      placeholder="Type a message… (Shift+Enter for newline)"
      rows="1"
    ></textarea>
    <button id="clear-btn" title="Clear conversation">🗑</button>
    <button id="send-btn">Send</button>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl    = document.getElementById('user-input');
    const sendBtn    = document.getElementById('send-btn');
    const clearBtn   = document.getElementById('clear-btn');
    const emptyState = document.getElementById('empty-state');
    const errorMsg   = document.getElementById('error-msg');
    const modelSel   = document.getElementById('model-select');

    let history = [];
    let streaming = false;

    // Auto-grow textarea
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
    });

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!streaming) sendMessage();
      }
    });

    sendBtn.addEventListener('click', () => { if (!streaming) sendMessage(); });
    clearBtn.addEventListener('click', clearConversation);

    function setStreaming(val) {
      streaming = val;
      sendBtn.disabled = val;
      sendBtn.textContent = val ? '…' : 'Send';
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
      setTimeout(() => { errorMsg.style.display = 'none'; }, 5000);
    }

    function clearConversation() {
      history = [];
      messagesEl.innerHTML = '';
      messagesEl.appendChild(emptyState);
      emptyState.style.display = 'flex';
    }

    function appendBubble(role, text) {
      if (emptyState.parentNode) emptyState.remove();

      const row = document.createElement('div');
      row.className = `bubble-row ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = role === 'user' ? 'U' : 'AI';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      row.appendChild(avatar);
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return bubble;
    }

    function renderContent(bubble, text, showCursor) {
      // Simple markdown-like rendering: code blocks and inline code
      const escaped = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      let html = escaped
        // fenced code blocks
        .replace(/```[\w]*\n?([\s\S]*?)```/g, (_, code) =>
          `<pre><code>${code.trim()}</code></pre>`)
        // inline code
        .replace(/`([^`]+)`/g, '<code>$1</code>');

      bubble.innerHTML = html + (showCursor ? '<span class="cursor"></span>' : '');
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      inputEl.value = '';
      inputEl.style.height = 'auto';

      appendBubble('user', text);
      history.push({ role: 'user', content: text });

      const aiBubble = appendBubble('assistant', '');
      renderContent(aiBubble, '', true);

      setStreaming(true);

      let fullContent = '';

      try {
        const resp = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: modelSel.value, messages: history }),
        });

        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const chunk = JSON.parse(line.slice(6));
            if (chunk.error) { showError(chunk.error); break; }
            fullContent += chunk.content;
            renderContent(aiBubble, fullContent, !chunk.done);
            if (chunk.done) break;
          }
        }
      } catch (err) {
        showError(`Connection error: ${err.message}`);
        renderContent(aiBubble, fullContent || '(error)', false);
      }

      if (fullContent) {
        history.push({ role: 'assistant', content: fullContent });
      }

      setStreaming(false);
      inputEl.focus();
    }

    // Refresh model list on load in case Ollama was still starting
    async function refreshModels() {
      try {
        const resp = await fetch('/api/models');
        const data = await resp.json();
        if (data.models && data.models.length > 0) {
          const current = modelSel.value;
          modelSel.innerHTML = '';
          data.models.forEach(m => {
            const opt = document.createElement('option');
            opt.value = m;
            opt.textContent = m;
            if (m === current) opt.selected = true;
            modelSel.appendChild(opt);
          });
        }
      } catch (_) {}
    }

    refreshModels();
  </script>
</body>
</html>
