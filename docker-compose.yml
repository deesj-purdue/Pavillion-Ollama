services:
  ollama:
    image: ollama/ollama:latest
    container_name: pavillion-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0

  web:
    build: ./app
    container_name: pavillion-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5000}:5000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DEFAULT_MODEL=${DEFAULT_MODEL:-llama3.2}
    depends_on:
      - ollama

volumes:
  ollama_data:
